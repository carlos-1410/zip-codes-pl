name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec rubocop

  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor comes from required_ruby_version; the gemspec promise is
        # worth nothing if only the newest release is ever exercised.
        ruby: ["3.2", "3.3", "3.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  dataset:
    name: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      # The dataset is committed and regenerated by hand, so nothing else would
      # notice it drifting from its manifest or from the model's columns.
      - name: Verify the bundled dataset
        run: bundle exec rake zip_codes:pl:verify

      - name: Build the gem and confirm the dataset ships with it
        run: |
          gem build zip-codes-pl.gemspec --output /tmp/zip-codes-pl.gem
          tar -xOf /tmp/zip-codes-pl.gem data.tar.gz | tar -tzf - > /tmp/gem-files
          grep -qx 'data/zip-codes-pl.tsv' /tmp/gem-files
          grep -qx 'data/zip-codes-pl.manifest.json' /tmp/gem-files

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      - name: Scan dependencies against current advisories
        run: bundle exec bundler-audit check --update

  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - test
      - dataset
      - audit

    steps:
      - name: Require every blocking job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          count=0
          for result in $RESULTS; do
            count=$((count + 1))
            if [ "$result" != "success" ]; then
              printf 'Blocking job result: %s\n' "$result" >&2
              exit 1
            fi
          done
          if [ "$count" -ne 4 ]; then
            printf 'Expected 4 blocking results, received %s\n' "$count" >&2
            exit 1
          fi
